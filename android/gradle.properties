org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Shared semver of the next release (iOS MARKETING_VERSION in ios/project.yml must match; release_preflight.py checks).
# CI overrides both from the tag and run number: -Pscanfit.versionName=1.0.0 -Pscanfit.versionCode=<run number>
scanfit.versionName=0.1.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
