# Run from ios/: swiftlint --strict   (CLAUDE.md rule 8: Swift 6 strict concurrency, no force unwraps outside tests)
included:
  - ScanFit
  - Packages
excluded:
  - Packages/**/.build
  - "**/Generated"       # produced by spec/tools/*.py
  - "**/.build"
opt_in_rules:
  - force_unwrapping
  - explicit_init
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - redundant_nil_coalescing
  - overridden_super_call
force_unwrapping: error
force_cast: error
force_try: error
# Policy mirrors the Kotlin side (android/config/detekt/detekt.yml) so both platforms are held to the same bar:
# 120 columns in sources, complexity 25, method length 100, and tests exempt from length/complexity rules.
disabled_rules:
  - trailing_comma    # comma style is SwiftFormat's job (--commas always); both styles are valid Swift 6

identifier_name:
  min_length: 1       # pixel kernels use r/g/b/x/y/i/k like the spec; Kotlin has no min-length rule either
line_length:
  warning: 120        # detekt MaxLineLength 120
  error: 160
  ignores_urls: true
cyclomatic_complexity:
  warning: 25         # detekt CyclomaticComplexMethod allowedComplexity 25 (FitEngine.fit mirrors ALGORITHMS 1.3-1.4)
  error: 40
function_body_length:
  warning: 100        # detekt LongMethod allowedLines 100
  error: 150
function_parameter_count:
  warning: 6          # pixel kernels take (pixels, w, h) plus their parameters
  error: 8
type_body_length:
  warning: 300
  error: 500
file_length:
  warning: 400
  error: 700
nesting:
  type_level: 3
custom_rules:
  no_global_actor_unsafe:
    name: "No nonisolated(unsafe)"
    regex: 'nonisolated\(unsafe\)'
    message: "Use an actor or @MainActor instead of nonisolated(unsafe) (Swift 6 strict concurrency)."
    severity: error
