<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 18% 20%, #5563D0 0%, #3F4DB8 45%, #2D3894 100%);
    color: #fff;
    display: flex; align-items: center; gap: 40px; padding: 0 56px;
  }
  .left { flex: 1 1 52%; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .brand svg { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .brand span { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }
  h1 { font-size: 46px; line-height: 1.08; font-weight: 800; letter-spacing: -1px; margin-bottom: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips span { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
    padding: 7px 14px; font-size: 17px; font-weight: 600; }
  .grid { flex: 0 0 400px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .tile { border-radius: 20px; padding: 16px; height: 108px; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 8px 22px rgba(0,0,0,.18); }
  .tile i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .tile svg { width: 22px; height: 22px; }
  .tile b { font-size: 19px; font-weight: 700; }
  .photo { background: #CDF1F0; color: #002021; } .photo i { background: #00696B; color: #CDF1F0; }
  .ink { background: #EBDDFF; color: #23005C; } .ink i { background: #6A3FB0; color: #EBDDFF; }
  .pdf { background: #FFD9E2; color: #3E0019; } .pdf i { background: #B4235A; color: #FFD9E2; }
  .check { background: #DDF2E2; color: #0B3A1A; } .check i { background: #1B7A3A; color: #DDF2E2; }
  .exam { background: #E1E4FF; color: #10186B; } .exam i { background: #3F4DB8; color: #E1E4FF; }
</style>
