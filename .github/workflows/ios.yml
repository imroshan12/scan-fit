name: ios
on:
  pull_request:
    paths: ['ios/**', 'spec/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    tags: ['ios-v*']
    paths: ['ios/**', 'spec/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the signed presets snapshot the app embeds (dev key)
        working-directory: .
        run: |
          pip install -r spec/tools/requirements.txt
          spec/tools/build_all.sh
      - name: Toolchain (a compiler difference from the dev machine shows up here first)
        run: |
          swift --version && xcodebuild -version
          echo "::notice title=Toolchain::$(swift --version 2>&1 | head -1) / $(xcodebuild -version | head -1)"
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Presets signature verifier against the shared signing vector (Swift, no Python)
        run: Scripts/test_verify_presets.sh
      - run: swiftlint --strict
      # DesignSystemTests are skipped here on purpose: SwiftPM's native build copies the String Catalog without compiling
      # it, so every lookup returns its key. They run under the Xcode build system in the simulator step below.
      - name: Engine + conformance tests (Core), with coverage
        run: |
          set -o pipefail
          swift test --package-path Packages/Core --enable-code-coverage --skip DesignSystemTests 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      # Surfaces the failing tests as an annotation on the run page (the raw log needs a sign-in to read).
      - name: Failing tests, as an annotation
        if: failure()
        run: |
          summary=$(grep -E "✘" "$RUNNER_TEMP/core-tests.log" 2>/dev/null | sort -u | head -40 | cut -c1-240 | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Core test failures::${summary:-no failing-test lines found, see the step log}"
      - name: Engine coverage gate (>= 90% lines)
        working-directory: ios/Packages/Core
        run: python3 ../../Scripts/check_coverage.py
      - name: Feature tests
        run: swift test --package-path Packages/Features
      - name: App + string-catalog tests on an iPhone 11 Pro Max simulator, the low-end profile (iOS 17 if installed)
        run: |
          xcodegen generate
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=sorted((x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']),key=lambda x:[int(n) for n in x['version'].split('.')]); m=[x for x in r if x['version'].startswith('17.')]; print((m or r)[-1]['identifier'])")
          echo "::notice title=Simulator::iPhone 11 Pro Max on $RUNTIME"
          UDID=$(xcrun simctl create "ScanFit 11 Pro Max" com.apple.CoreSimulator.SimDeviceType.iPhone-11-Pro-Max "$RUNTIME")
          xcodebuild -scheme ScanFit -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO test
          # The String Catalog is compiled only by the Xcode build system, so its tests run here, on the real platform.
          (cd Packages/Core && xcodebuild test -scheme Core-Package -destination "id=$UDID" -only-testing:DesignSystemTests CODE_SIGNING_ALLOWED=NO)
      # Release configuration only runs at archive time (Release warnings-as-errors, dSYM, the embed checks, Info.plist
      # versions), so rehearse it on every PR with a throwaway presets key (spec/tools/rehearsal_key.sh is CI-only).
      # Unsigned: no Apple account or secret is needed or used.
      - name: Release archive rehearsal (unsigned, throwaway key)
        working-directory: .
        run: |
          spec/tools/rehearsal_key.sh
          cd ios && Scripts/archive.sh --no-sign --version 0.0.1 --build 1

  # Tags: ios-v1.2.3 is a final release (Hindi must be reviewed: no TODO_HI). ios-v1.2.3-rc1 / -beta1 is a pre-release for
  # TestFlight testing (machine-drafted Hindi allowed). docs/RELEASE_CHECKLIST.md lists the secrets and App Store Connect setup.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-release          # protect with required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Version and channel from the tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like ios-v1.2.3 or ios-v1.2.3-rc1"; exit 1; }
          # CFBundleShortVersionString takes dotted numbers only: the -rc suffix stays in the tag.
          echo "version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "hindi_flag=--allow-todo-hi" >> "$GITHUB_OUTPUT"; echo "final=" >> "$GITHUB_OUTPUT"
          else
            echo "hindi_flag=" >> "$GITHUB_OUTPUT"; echo "final=--final" >> "$GITHUB_OUTPUT"
          fi
      - name: Presets signed with the production key
        env:
          PRESETS_SIGNING_KEY: ${{ secrets.PRESETS_SIGNING_KEY }}
        run: |
          pip install -r spec/tools/requirements.txt
          spec/tools/build_all.sh --release ${{ steps.tag.outputs.hindi_flag }}
      - name: Preflight (fails on anything a release still needs)
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 spec/tools/release_preflight.py --platform ios ${{ steps.tag.outputs.final }}
      - name: App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # Accepts the secret as base64 of the .p8 (as documented) or as the raw .p8 text, and checks the result is a real
          # private key before xcodebuild sees it. Never prints the key.
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEY" 2>/dev/null || true
          fi
          chmod 600 "$KEY"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY" || ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8_BASE64 is not a valid App Store Connect key. Set it to the output of: base64 -i AuthKey_<KEYID>.p8"
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - name: Archive, sign (cloud-managed, via the API key) and upload to TestFlight
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: Scripts/archive.sh --version ${{ steps.tag.outputs.version }} --build ${{ github.run_number }} --upload
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey*.p8
      - uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms-${{ steps.tag.outputs.version }}
          path: ios/build/ScanFit.xcarchive/dSYMs
