name: spec
# Validates the shared contract and regenerates nothing silently (drift = failure). The site, including the presets
# bundle, is published by pages.yml. Path-filtered: only runs when the contract or the site changes.
on:
  pull_request:
    paths: ['spec/**', 'web/**', '.github/workflows/spec.yml']
  push:
    branches: [main]
    paths: ['spec/**', 'web/**', '.github/workflows/spec.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: spec/tools/requirements.txt
      - run: pip install -r spec/tools/requirements.txt
      - name: Validate and bundle presets
        run: python3 spec/tools/build_presets.py
      - name: Generated files are up to date (no drift)
        run: |
          python3 spec/tools/make_presets_load_cases.py --check
          python3 spec/tools/gen_strings.py --check
          python3 spec/tools/gen_tokens.py --check
          python3 spec/tools/gen_analytics.py --check
      - name: Generator and presets-load-case tests
        run: python3 -m unittest spec/tools/test_tools.py -v
      # Not a byte-diff: PNG/JPEG bytes depend on the Pillow/zlib version (verified: two fixtures differ across
      # versions). Fixtures are committed; the echo-page tests below assert their *properties* (CMYK, progressive, ...).
      - name: Fixture generator still runs
        run: python3 spec/tools/make_fixtures.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Echo-page inspector tests
        run: node --test web/upload-test/inspect.test.mjs
