# Publishes web/ (landing page, privacy policy, terms, help, account deletion, upload-test, presets) to GitHub Pages:
# https://imroshan12.github.io/scan-fit/ (user decision 2026-10-20). One-time setup: repo Settings > Pages > Build and
# deployment > Source: "GitHub Actions". The app links to these pages (AppLinks on both apps), so a broken deploy
# breaks Settings and the paywall's legal links.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'spec/presets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The apps' OTA sync reads /presets/v2/presets.json (not signed: the apps check its format, spec/README.md).
      - name: Presets bundle for the site
        run: |
          pip install -r spec/tools/requirements.txt
          python3 spec/tools/build_presets.py
          mkdir -p web/presets/v2
          cp spec/dist/presets.json web/presets/v2/presets.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
