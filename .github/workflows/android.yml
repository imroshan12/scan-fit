name: android
on:
  pull_request:
    paths: ['android/**', 'spec/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['android/**', 'spec/**', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the signed presets snapshot the app embeds (dev key; release tags use the real key below)
        working-directory: .
        run: |
          pip install -r spec/tools/requirements.txt
          spec/tools/build_all.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Format, static analysis, unit + conformance tests
        run: ./gradlew spotlessCheck detekt testDebugUnitTest lint --continue
      - name: Engine coverage gate (>= 90%, CLAUDE.md rule 10)
        run: |
          ./gradlew :core:inspect:test :core:match:test :core:imaging:createDebugUnitTestCoverageReport
          python3 config/coverage/check_coverage.py --min 90
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      # R8, release lint and the embed checks only run in the release configuration, so rehearse it on every PR with a
      # throwaway presets key (spec/tools/rehearsal_key.sh is CI-only). Unsigned: no secret is needed or used.
      - name: Release build rehearsal (R8 + lint vital, unsigned, throwaway key)
        working-directory: .
        run: |
          spec/tools/rehearsal_key.sh
          cd android && ./gradlew :app:assembleRelease
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**

  # Tags: android-v1.2.3 is a final release (Hindi must be reviewed: no TODO_HI). android-v1.2.3-rc1 / -beta1 is a
  # pre-release for internal / closed testing (machine-drafted Hindi allowed). docs/RELEASE_CHECKLIST.md lists the secrets.
  # Release builds embed spec/signing/prod_public_key.b64 and refuse the dev key (EmbedPresetsTask).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release      # protect with required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version and channel from the tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like android-v1.2.3 or android-v1.2.3-rc1"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "hindi_flag=--allow-todo-hi" >> "$GITHUB_OUTPUT"; echo "final=" >> "$GITHUB_OUTPUT"
          else
            echo "hindi_flag=" >> "$GITHUB_OUTPUT"; echo "final=--final" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "SCANFIT_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Presets signed with the production key
        env:
          PRESETS_SIGNING_KEY: ${{ secrets.PRESETS_SIGNING_KEY }}
        run: |
          pip install -r spec/tools/requirements.txt
          spec/tools/build_all.sh --release ${{ steps.tag.outputs.hindi_flag }}
      - name: Preflight (fails on anything a release still needs)
        env:
          SCANFIT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SCANFIT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SCANFIT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: python3 spec/tools/release_preflight.py --platform android ${{ steps.tag.outputs.final }}
      - name: Bundle + APK (R8, signed with the upload key)
        working-directory: android
        env:
          SCANFIT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SCANFIT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SCANFIT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew :app:bundleRelease :app:assembleRelease
          -Pscanfit.versionName=${{ steps.tag.outputs.version }}
          -Pscanfit.versionCode=${{ github.run_number }}
      - name: The bundle is signed with the upload key
        working-directory: android
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /dev/stderr | grep -q "jar verified"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.tag.outputs.version }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
      # The first upload of a new app is manual (Play Console > Internal testing > Create release): Google only opens the
      # publishing API after that. Automating later = a Play service-account secret + an upload step; keep mapping.txt for
      # crash deobfuscation (Play also takes it from the bundle).
